name = "zerot-app"
type = "service"
main = "src/worker.ts"
compatibility_date = "2024-12-16"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "lms"
database_id = "6f86511c-06ea-4391-9b37-9a6912007d7b"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lms"
jurisdiction = "eu"

# Environment variables
[env.production]
route = "api.zerot.com/*"

[env.development]
route = "localhost:8787/*"

# Build configuration
[build]
command = "npm run build"
cwd = "."
